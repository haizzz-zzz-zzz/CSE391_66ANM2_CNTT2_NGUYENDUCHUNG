<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Sinh Viên</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <div class="container" >
        <h2>Quản Lý Điểm Sinh Viên</h2>
        
        <div class="input-group">
            <input type="text" id="hoTen" class="input-ho-ten" placeholder="Nhập họ và tên">
            <input type="number" id="diem" class="input-diem" placeholder="Nhập điểm (0 - 10)" min="0" max="10" step="0.1">
            <button class="btn-add" onclick="themSinhVien()">+ Thêm</button>
        </div>

        <div class="filter-group">
            <input type="text" id="timkiem" class="input-tim-kiem" placeholder="🔍 Tìm kiếm theo tên sinh viên...">
            <select id="locXepLoai" class="select-filter">
                <option value="All">Tất cả xếp loại</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%">STT</th>
                    <th style="width: 35%">Họ tên</th>
                    <th id="cotDiem" style="width: 15%; cursor: pointer;" title="Nhấn để sắp xếp">
                        Điểm <span id="sortArrow"></span>
                    </th>
                    <th style="width: 25%">Xếp loại</th>
                    <th style="width: 20%">Thao tác</th>
                </tr>
            </thead>
            <tbody id="danhSachSinhVien">
                </tbody>
        </table>

        <div class="stats">
          <p>Đang hiển thị: <span id="tongSV">0</span> sinh viên</p>
          <p>Điểm trung bình (danh sách hiện tại): <span id="diemTB">0.00</span></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
