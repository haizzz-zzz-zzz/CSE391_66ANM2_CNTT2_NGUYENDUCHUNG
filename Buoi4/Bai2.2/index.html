<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.2 - Form Đặt Hàng</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Form Đặt Hàng</h1>
        <form id="orderForm">
            <div class="form-group">
                <label for="product">Tên sản phẩm <span class="required">*</span></label>
                <select id="product" name="product" class="form-control">
                    <option value="">--Chọn sản phẩm--</option>
                    <option value="ao">Áo sơ mi (150,000đ)</option>
                    <option value="quan">Quần tây (280,000đ)</option>
                    <option value="giay">Giày thể thao (450,000đ)</option>
                    <option value="tui">Túi xách (320,000đ)</option>
                    <option value="non">Nón lưỡi trai (95,000đ)</option>
                </select>
                <span class="error-message" id="productError"></span>
            </div>

            <div class="form-group">
                <label for="quantity">Số lượng <span class="required">*</span></label>
                <input 
                    type="number" 
                    id="quantity" 
                    name="quantity" 
                    placeholder="Nhập từ 1 đến 99"
                    min="1" 
                    max="99"
                    class="form-control"
                >
                <span class="error-message" id="quantityError"></span>
            </div>

            <div class="form-group">
                <label for="deliveryDate">Ngày giao hàng <span class="required">*</span></label>
                <input 
                    type="date" 
                    id="deliveryDate" 
                    name="deliveryDate" 
                    class="form-control"
                >
                <span class="error-message" id="deliveryDateError"></span>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ giao <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    placeholder="Nhập địa chỉ giao hàng..."
                    class="form-control"
                >
                <span class="error-message" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="notes">Ghi chú (không bắt buộc)</label>
                <textarea 
                    id="notes" 
                    name="notes" 
                    placeholder="Nhập ghi chú (tối đa 200 ký tự)"
                    rows="4"
                    class="form-control"
                ></textarea>
                <span class="error-message" id="notesError"></span>
            </div>

            <div class="form-group">
                <label>Phương thức thanh toán <span class="required">*</span></label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="payment" value="cod"> COD (Trả tiền khi nhận hàng)
                    </label>
                    <label>
                        <input type="radio" name="payment" value="transfer"> Chuyển khoản ngân hàng
                    </label>
                    <label>
                        <input type="radio" name="payment" value="wallet"> Ví điện tử
                    </label>
                </div>
                <span class="error-message" id="paymentError"></span>
            </div>

            <div class="total-price">
                <strong>Tổng tiền:</strong> <span id="totalAmount">0đ</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Đặt Hàng</button>
        </form>

        <div class="confirmation-modal" id="confirmationModal">
            <div class="modal-content">
                <h2>Xác Nhận Đơn Hàng</h2>
                <div class="order-summary">
                    <p><strong>Sản phẩm:</strong> <span id="summaryProduct"></span></p>
                    <p><strong>Số lượng:</strong> <span id="summaryQuantity"></span></p>
                    <p><strong>Ngày giao hàng:</strong> <span id="summaryDate"></span></p>
                    <p><strong>Địa chỉ giao:</strong> <span id="summaryAddress"></span></p>
                    <p><strong>Tổng tiền:</strong> <span id="summaryTotal" class="total-text"></span></p>
                </div>
                <div class="modal-buttons">
                    <button class="btn-confirm" id="btnConfirm">Xác Nhận</button>
                    <button class="btn-cancel" id="btnCancel">Hủy</button>
                </div>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            <span class="success-icon">✓</span> Đặt hàng thành công!
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
