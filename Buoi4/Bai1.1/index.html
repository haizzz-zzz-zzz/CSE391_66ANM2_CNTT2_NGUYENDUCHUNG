<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Sinh Viên</title>
    <link rel="stylesheet" href="index.css">
    
    
</head>
<body>
    
    <div class="container" >
        <h2>Quản Lý Điểm Sinh Viên</h2>
        
        <div class="input-group">
            <input type="text" id="hoTen" class="input-ho-ten" placeholder="Nhập họ và tên">
            <input type="number" id="diem" class="input-diem" placeholder="Nhập điểm (0 - 10)" min="0" max="10" step="0.1">
            <button class="btn-add" onclick="themSinhVien()">+ Thêm</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%">STT</th>
                    <th style="width: 35%">Họ tên</th>
                    <th style="width: 15%">Điểm</th>
                    <th style="width: 25%">Xếp loại</th>
                    <th style="width: 20%">Thao tác</th>
                </tr>
            </thead>
            <tbody id="danhSachSinhVien">
                </tbody>
        </table>

        <div class="stats">
          <p>Tổng số sinh viên cả lớp: <span id="tongSV">0</span></p>
          <p>Điểm trung bình cả lớp: <span id="diemTB">0.0</span></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
