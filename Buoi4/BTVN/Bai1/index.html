<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.1 - Form Đăng Ký Tài Khoản</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Đăng Ký Tài Khoản</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">
                    Họ và tên <span class="required">*</span>
                    <span class="char-counter" id="charCounter">0/50</span>
                </label>
                <input 
                    type="text" 
                    id="fullname" 
                    name="fullname" 
                    placeholder="Nhập họ và tên"
                    class="form-control"
                    maxlength="50"
                >
                <span class="error-message" id="fullnameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Nhập email (name@domain.com)"
                    class="form-control"
                >
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="phone" 
                    name="phone" 
                    placeholder="Nhập 10 chữ số"
                    class="form-control"
                >
                <span class="error-message" id="phoneError"></span>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Nhập mật khẩu"
                        class="form-control"
                    >
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
                <div class="password-strength-bar">
                    <div class="strength-indicator" id="strengthIndicator"></div>
                </div>
                <span class="strength-text" id="strengthText"></span>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Nhập lại mật khẩu"
                    class="form-control"
                >
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label>Giới tính <span class="required">*</span></label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="male"> Nam
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female"> Nữ
                    </label>
                    <label>
                        <input type="radio" name="gender" value="other"> Khác
                    </label>
                </div>
                <span class="error-message" id="genderError"></span>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" name="terms"> 
                    Tôi đã đọc và đồng ý với <a href="#">Điều khoản sử dụng</a> <span class="required">*</span>
                </label>
                <span class="error-message" id="termsError"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Đăng Ký</button>
        </form>

        <div class="success-message" id="successMessage">
            <span class="success-icon">✓</span> Đăng ký thành công!
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
