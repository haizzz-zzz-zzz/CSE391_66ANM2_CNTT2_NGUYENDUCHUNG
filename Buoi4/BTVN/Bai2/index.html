<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN Bài 2 - Form Đăng Ký Nhiều Bước</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Đăng Ký Tài Khoản</h1>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Bước 1/3</div>
        </div>

        <form id="multiStepForm">
            <div class="form-step active" id="step1">
                <h2>Bước 1: Thông Tin Cá Nhân</h2>
                
                <div class="form-group">
                    <label for="fullname">
                        Họ và tên <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        placeholder="Nhập họ và tên"
                        class="form-control"
                    >
                    <span class="error-message" id="fullnameError"></span>
                </div>

                <div class="form-group">
                    <label for="dob">
                        Ngày sinh <span class="required">*</span>
                    </label>
                    <input 
                        type="date" 
                        id="dob" 
                        name="dob" 
                        class="form-control"
                    >
                    <span class="error-message" id="dobError"></span>
                </div>

                <div class="form-group">
                    <label>Giới tính <span class="required">*</span></label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="male"> Nam
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female"> Nữ
                        </label>
                        <label>
                            <input type="radio" name="gender" value="other"> Khác
                        </label>
                    </div>
                    <span class="error-message" id="genderError"></span>
                </div>
            </div>

            <div class="form-step" id="step2">
                <h2>Bước 2: Thông Tin Tài Khoản</h2>
                
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Nhập email (name@domain.com)"
                        class="form-control"
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Nhập mật khẩu"
                            class="form-control"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                    </div>
                    <div class="password-strength-bar">
                        <div class="strength-indicator" id="strengthIndicator"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Nhập lại mật khẩu"
                        class="form-control"
                    >
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
            </div>

            <div class="form-step" id="step3">
                <h2>Bước 3: Xác Nhận Thông Tin</h2>
                
                <div class="review-container">
                    <div class="review-section">
                        <h3>Thông Tin Cá Nhân</h3>
                        <div class="review-item">
                            <span class="review-label">Họ và tên:</span>
                            <span class="review-value" id="reviewFullname">-</span>
                        </div>
                        <div class="review-item">
                            <span class="review-label">Ngày sinh:</span>
                            <span class="review-value" id="reviewDob">-</span>
                        </div>
                        <div class="review-item">
                            <span class="review-label">Giới tính:</span>
                            <span class="review-value" id="reviewGender">-</span>
                        </div>
                    </div>

                    <div class="review-section">
                        <h3>Thông Tin Tài Khoản</h3>
                        <div class="review-item">
                            <span class="review-label">Email:</span>
                            <span class="review-value" id="reviewEmail">-</span>
                        </div>
                        <div class="review-item">
                            <span class="review-label">Mật khẩu:</span>
                            <span class="review-value">••••••••</span>
                        </div>
                    </div>
                </div>

                <div class="confirm-checkbox">
                    <label>
                        <input type="checkbox" id="confirmCheckbox" name="confirmCheckbox">
                        Tôi xác nhận tất cả thông tin trên là chính xác <span class="required">*</span>
                    </label>
                    <span class="error-message" id="confirmCheckboxError"></span>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;">
                    ← Quay Lại
                </button>
                <button type="button" class="btn btn-primary" id="nextBtn">
                    Tiếp Theo →
                </button>
                <button type="submit" class="btn btn-success" id="submitBtn" style="display: none;">
                    Hoàn Tất
                </button>
            </div>
        </form>

        <div class="success-message" id="successMessage">
            <div class="success-content">
                <span class="success-icon">✓</span>
                <h2>Đăng ký thành công!</h2>
                <p>Cảm ơn bạn đã hoàn thành quá trình đăng ký.</p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
