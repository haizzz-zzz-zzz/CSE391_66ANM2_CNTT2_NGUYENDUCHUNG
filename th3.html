<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 03 - Chuẩn HTML5</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid black; 
            padding: 8px; 
            text-align: center;
            font-size: 16px;
        }       
        thead th {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" colspan="2">Student</th>
                <th colspan="4">Exam</th>

            </tr>
            <tr>

                <th>Q3</th>

            </tr>
            <tr>

                <th>8</th>
                <th>7</th>
                <th>5</th>
                <th>6</th>
                <th>7</th>
                <th>8</th>
                <th>NR</th>
                <th>R</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="text-left">80549061</td>
                <td class="text-left">John</td>

                <td class="text-left">80549062</td>

                <td>50%</td>
                <td>16.5</td>
                <td>16.5</td>
                <td>17</td>
            </tr>
            <tr>
                <td class="text-left">80549063</td>
                <td class="text-left">Claire</td>
                <td colspan="4"></td> <td>50%</td>
                <td>50%</td>
                <td>50%</td>
                <td>10.0</td>

        </tbody>
    </table>
</body>
</html>
