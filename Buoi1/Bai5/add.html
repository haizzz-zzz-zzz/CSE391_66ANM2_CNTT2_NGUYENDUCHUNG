<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Employee</title>
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            margin: 0;
        }

        .form-container {
            background: white;
            width: 700px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .form-header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-header h3 { margin: 0; font-size: 18px; font-weight: normal; }
        .close-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }

        .form-body { padding: 20px; }
        
        .form-row {
            display: flex;
            gap: 20px; 
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1; 
            display: flex;
            flex-direction: column;
        }

        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        
        input[type="text"], 
        input[type="email"], 
        select {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus { border-color: #86b7fe; } 

        .radio-group { margin-top: 5px; }
        .radio-group label { font-weight: normal; margin-right: 15px; cursor: pointer;}
        
        .form-footer {
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            text-align: right; 
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-save { background-color: #198754; color: white; margin-right: 10px; } 
        .btn-cancel { background-color: #6c757d; color: white; } 
        
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h3>New Employee</h3>
            <a href="index.html" class="close-btn">&times;</a>
        </div>

        <div class="form-body">
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text">
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <select>
                            <option>-- Select Position --</option>
                            <option>Staff</option>
                            <option>Manager</option>
                            <option>CEO</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Sex</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="sex" value="male">
                        <label for="male">Male</label>
                        
                        <input type="radio" id="female" name="sex" value="female">
                        <label for="female">Female</label>
                    </div>
                </div>
            </form>
        </div>

        <div class="form-footer">
            <button class="btn btn-save">Save</button>
            <a href="index.html" class="btn btn-cancel">Cancel</a>
        </div>
    </div>

</body>
</html>
